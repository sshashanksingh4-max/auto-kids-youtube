name: kids-youtube-zero-cost-trial

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/kids-trial.yml"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional Hindi story topic"
        required: false
        default: ""
  schedule:
    - cron: "30 3 * * *"

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KIDS_TOPIC: ${{ github.event.inputs.topic || 'चिंटू और दोस्तों की जादुई किताब' }}
      KIDS_OUTPUT: /tmp/kids-video.mp4
      KIDS_SHORT_OUTPUT: /tmp/kids-short.mp4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak fonts-noto-core
          python -m pip install --upgrade pip
          pip install pillow httpx

      - name: Render Hindi kids trial video
        run: python -m app.local_render

      - name: Validate output
        run: |
          test -s /tmp/kids-video.mp4
          test -s /tmp/kids-short.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 /tmp/kids-video.mp4
          ffprobe -v error -show_entries stream=width,height -of csv=s=x:p=0 /tmp/kids-short.mp4
          python -m app.video_qa /tmp/kids-video.mp4
          python -m app.video_qa /tmp/kids-short.mp4 --require-vertical

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hindi-kids-trial-video
          path: |
            /tmp/kids-video.mp4
            /tmp/kids-video.voices.json
            /tmp/kids-short.mp4
            /tmp/kids-short.voices.json
          retention-days: 3
