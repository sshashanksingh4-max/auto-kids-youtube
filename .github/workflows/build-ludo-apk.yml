name: Build and Test Ludo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ludo-apk/**'
      - '.github/workflows/build-ludo-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ludo-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run 100 gameplay simulations
        run: python3 tests/test_100_games.py
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Run Android lint/compile checks
        run: gradle :app:lintDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ludo-reference-9x16-debug-apk
          path: ludo-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
