name: python-checks

on:
  pull_request:
    paths:
      - "app/providers/youtube.py"
      - "tests/**"
      - ".github/workflows/python-checks.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YouTube client dependencies
        run: python -m pip install google-api-python-client google-auth
      - name: Run unit checks
        run: python -m unittest discover -s tests -v
